# =============================================================================
# Whisper Voice-Controlled OS & Dictation Keybindings for Hyprland
# =============================================================================

# Voice Dictation (Press to start, press again to stop & type)
bind = $mainMod, Space, exec, ~/.local/bin/whisper-ptt toggle

# Voice OS & Linux Shell Command Generation (via local Ollama)
bind = $mainMod, C, exec, ~/.local/bin/whisper-ptt command-toggle
bind = $mainMod SHIFT, Space, exec, ~/.local/bin/whisper-ptt command-toggle

# Push-to-Talk (Hold-to-talk option, e.g. for mouse side button or Caps Lock)
# bind = , mouse:276, exec, ~/.local/bin/whisper-ptt start
# bindr = , mouse:276, exec, ~/.local/bin/whisper-ptt stop
